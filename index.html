<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>背壳锁 BK life · 智能门锁演示</title>
<style>
:root{
  --navy:#1A2246; --navy2:#2A3563; --purple:#26003B; --ink:#33312F;
  --orange:#FF9902; --orange2:#FFB84D; --bg:#F6F6F6; --card:#FFFFFF;
  --line:#ECECEC; --muted:#9E9A93; --muted2:#C6C2BB; --green:#22C55E; --red:#E5484D;
  --r:22px; --r-sm:14px; --shadow:0 10px 30px rgba(26,34,70,.08);
  --tab-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:#0B0D14; color:var(--ink); display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
#app{width:100%;max-width:430px;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
/* ---------- status bar ---------- */
.statusbar{
  height:44px;padding:0 20px;display:flex;align-items:flex-end;justify-content:space-between;
  padding-bottom:8px;color:var(--ink);background:transparent;position:absolute;top:0;left:0;right:0;z-index:60;
  font-size:15px;font-weight:600;transition:color .3s;
}
.statusbar .sb-right{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.statusbar.navy{color:#fff}
/* ---------- screen ---------- */
#screen{position:absolute;top:0;left:0;right:0;bottom:0;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.screen{min-height:100%;padding-bottom:calc(var(--tab-h) + 28px)}
.screen.no-tab{padding-bottom:40px}
/* ---------- tab bar ---------- */
#tabbar{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;align-items:stretch;z-index:50;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#B4B7C2;cursor:pointer;position:relative;transition:color .2s}
.tab .t-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.tab .t-lb{font-size:10px;letter-spacing:.5px}
.tab.on{color:var(--navy)}
.tab.on .t-lb{font-weight:700}
.tab-center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;top:-16px;
}
.tab-center .bk-dot{
  width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--navy) 0%,var(--purple) 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;
  box-shadow:0 10px 22px rgba(38,0,59,.35);border:3px solid #fff;
}
.tab-center .t-lb{font-size:10px;color:var(--navy);font-weight:700;margin-top:2px;letter-spacing:.5px}
/* ---------- generic UI ---------- */
.page-head{
  position:relative;padding:50px 20px 16px;display:flex;align-items:center;justify-content:center;background:var(--bg);
}
.page-head .back{position:absolute;left:16px;top:48px;width:34px;height:34px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(26,34,70,.08)}
.page-head h1{font-size:18px;font-weight:700;color:var(--navy)}
.page-head .right{position:absolute;right:16px;top:48px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.sect{margin:18px 18px 0}
.sect-title{font-size:13px;color:var(--muted);margin:0 6px 10px;font-weight:600;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;cursor:pointer;position:relative}
.row + .row{border-top:1px solid var(--line)}
.row .r-ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.row .r-tx{flex:1;min-width:0}
.row .r-t{font-size:16px;font-weight:600;color:var(--ink)}
.row .r-s{font-size:12px;color:var(--muted);margin-top:2px}
.row .r-v{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.row .chev{color:#C6C8D0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
.badge.navy{background:var(--navy);color:#fff}
.badge.outline{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff}
.badge.orange{background:rgba(255,153,2,.12);color:#D97E00}
.badge.gray{background:#F0F1F4;color:var(--muted)}
.badge.red{background:rgba(229,72,77,.1);color:var(--red)}
.num-xl{font-size:52px;font-weight:800;line-height:1;color:var(--navy);font-family:"DIN Alternate","Helvetica Neue",sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-weight:700;font-size:16px;border-radius:16px;padding:14px;transition:transform .12s,opacity .2s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--orange),#FF7A00);color:#fff;box-shadow:0 8px 20px rgba(255,153,2,.3)}
.btn-orange{background:linear-gradient(135deg,var(--orange),#FF7A00);color:#fff;box-shadow:0 8px 20px rgba(255,153,2,.3)}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid #E3E4EA}
.btn.block{width:100%}
.input{
  width:100%;border:1.5px solid #E7E8EE;background:#FBFBFC;border-radius:14px;padding:13px 14px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;transition:border .2s;
}
.input:focus{border-color:var(--navy);background:#fff}
.label{font-size:13px;color:var(--muted);margin:14px 4px 7px;font-weight:600}
/* toggles */
.switch{width:48px;height:29px;border-radius:999px;background:#E4E5EA;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:left .2s}
.switch.on{background:linear-gradient(135deg,var(--navy),var(--purple))}
.switch.on::after{left:22px}
/* toast */
#toast{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);z-index:99;
  background:rgba(20,22,31,.92);color:#fff;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;max-width:78%;
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* modal */
#modal{
  position:absolute;top:0;left:0;right:0;bottom:0;inset:0;z-index:90;display:none;background:rgba(11,13,20,.5);
  align-items:flex-end;justify-content:center;
}
#modal.show{display:flex}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4.5px;border-radius:3px;background:#E3E4EA;margin:6px auto 14px}
.sheet h3{font-size:17px;font-weight:700;color:var(--ink);text-align:center}
.sheet .close-x{position:absolute;right:20px;margin-top:-30px;width:30px;height:30px;border-radius:50%;background:#F1F2F5;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
/* pill segmented */
.pills{display:flex;background:#F0F1F4;border-radius:12px;padding:4px;gap:4px}
.pill{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:600;color:var(--muted);border-radius:9px;cursor:pointer;transition:all .2s}
.pill.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(26,34,70,.1)}
/* empty state */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .e-ic{font-size:44px;margin-bottom:10px}
</style>
<style id="extra">
/* ---------- home ---------- */
.home-hero{background:linear-gradient(150deg,#F6F6F6 0%,#EFECE7 100%);padding:52px 20px 118px;color:var(--ink);position:relative;transition:background .4s}
.hh-top{display:flex;justify-content:space-between;align-items:flex-start}
.hh-name{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.hh-loc{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:13px;color:rgba(255,255,255,.72)}
.hh-acts{display:flex;gap:10px}
.hh-acts .ic-btn{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.hh-acts .ic-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.lockcard{margin:24px 4px 0;transition:background .4s,border-color .4s;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);border-radius:26px;padding:26px 24px;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.lockcard::after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,153,2,.4),transparent 70%)}
.lc-pct{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px;font-family:"DIN Alternate","Helvetica Neue",sans-serif}
.lc-lbl{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.8)}

.lc-cta{display:flex;gap:12px;margin-top:24px}
.lc-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 0;border-radius:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .12s}
.lc-btn:active{transform:scale(.96)}
.lc-btn.lite{background:#fff;color:var(--navy);border:none}
.home-body{position:relative;margin-top:-86px;padding:0 16px 20px}
.cloud-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 4px}
.cloud-foot .cf-l{font-size:12.5px;color:var(--muted)}
.cloud-foot .cf-r{font-size:14px;font-weight:800;color:var(--navy)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.quick .q{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px;cursor:pointer}
.quick .q .q-ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.quick .q .q-t{font-size:14.5px;font-weight:700;color:var(--ink)}
.quick .q .q-s{font-size:11.5px;color:var(--muted);margin-top:3px}
/* avatar chip */
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2A3563,#26003B);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.chip{display:flex;align-items:center;gap:7px}
/* cat-eye */
.cam-wrap{position:relative;height:calc(100vh - 44px);height:calc(100dvh - 44px);background:linear-gradient(180deg,#B9C6D4 0%,#8FA3B8 45%,#5E7389 100%);overflow:hidden}
.cam-noise{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px)}
.cam-top{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;color:#fff;z-index:5}
.cam-rec{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.cam-rec .red{width:8px;height:8px;border-radius:50%;background:#FF3B30;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.cam-batt{background:rgba(0,0,0,.35);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.cam-cta{position:absolute;left:0;right:0;bottom:calc(var(--tab-h) + 26px);display:flex;justify-content:center;gap:14px;z-index:5;padding:0 16px}
.cam-btn{width:58px;height:58px;border-radius:20px;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;cursor:pointer;transition:transform .12s}
.cam-btn:active{transform:scale(.92)}
.cam-btn.unlock{background:linear-gradient(135deg,#FF9902,#FF7A00);border:none;font-size:12px;font-weight:800}
.cam-btn.off{opacity:.5}
/* share key */
.share-hero{background:linear-gradient(150deg,#1A2246,#26003B 70%);padding:64px 24px 44px;color:#fff;text-align:center;position:relative;overflow:hidden}
.share-hero::after{content:"";position:absolute;left:50%;top:-70px;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,153,2,.35),transparent 68%)}
.av-pair{display:flex;align-items:center;justify-content:center;gap:14px;position:relative;z-index:2}

.av-line{width:44px;height:2px;background:rgba(255,255,255,.35)}
.av-nm{color:#fff;font-weight:700}
.key-card{margin:-26px 18px 0;background:#fff;border-radius:24px;box-shadow:0 18px 44px rgba(26,34,70,.18);padding:22px;position:relative;z-index:3}
.key-type{display:flex;gap:8px;margin:14px 0}
.kt{flex:1;text-align:center;padding:11px 0;border-radius:12px;background:#F3F4F7;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}

.time-row{display:flex;align-items:center;gap:8px;background:#F6F5F7;border-radius:14px;padding:13px 14px;margin-top:12px;font-size:13px;color:var(--ink)}

.mall-tabs .on{color:#fff;position:relative}

.mall-banner .mb-t{font-size:30px;font-weight:800;margin-top:6px}
.mall-banner .mb-s{font-size:13px;color:var(--orange2);margin-top:6px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.prod{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.prod .p-img{height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#E9EAF2,#F6F5F7);color:var(--navy)}
.prod .p-bd{padding:12px 14px 14px}
.prod .p-t{font-size:13px;font-weight:600;line-height:1.4;height:2.8em;overflow:hidden}
.prod .p-p{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.prod .p-now{color:var(--orange);font-weight:800;font-size:17px}

.disc-head{display:flex;align-items:center;gap:22px;padding:56px 20px 0;background:#fff}
.disc-head span{font-size:16px;font-weight:600;color:var(--muted2);cursor:pointer;position:relative}
.disc-head span.on{color:var(--ink)}

.post{background:#fff;border-radius:22px;margin:14px 16px 0;box-shadow:var(--shadow);overflow:hidden}

.rg .rg-ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.rg .rg-t{font-size:14.5px;font-weight:700}
.rg .rg-s{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
/* package cards */
.pk{border:2px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;transition:border .2s}
.pk.on{border-color:var(--navy);background:rgba(26,34,70,.04)}
.pk .pk-n{font-size:15px;font-weight:700}
.pk .pk-p{font-size:22px;font-weight:800;color:var(--orange);margin-top:6px}
.pk .pk-s{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- 换背壳 / skins ---------- */
.skin-tag{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;margin-bottom:18px;cursor:pointer}
.skin-tag .st-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.skin-tag b{margin-left:auto}
.skins-page{background:linear-gradient(200deg,#3A332C 0%,#574A41 30%,#8E7CC3 30% 40%,#D9A441 40% 50%,#2E6E5E 50% 60%,#1F2430 60%);min-height:100%}
.skins-top{display:flex;align-items:center;justify-content:space-between;padding:56px 18px 0;position:relative;z-index:3}
.skins-top .back{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;backdrop-filter:blur(6px)}
.skins-top .st-title{font-size:17px;font-weight:800;color:#fff;letter-spacing:1px}
.skins-top .st-ok{font-size:12.5px;color:#fff;cursor:pointer;background:rgba(255,255,255,.16);border-radius:999px;padding:7px 14px}
.skins-hero{padding:24px 22px 4px;position:relative;z-index:2}
.sk-h1{font-size:15px;letter-spacing:3px;color:rgba(255,255,255,.7)}
.sk-h2{font-size:34px;font-weight:800;color:#fff;margin-top:4px;letter-spacing:1px;text-shadow:0 6px 20px rgba(0,0,0,.3)}
.sk-h3{font-size:13px;color:rgba(255,255,255,.68);margin-top:9px}
.skin-stage{padding:18px 0 6px;position:relative;z-index:2}
.skin-carousel{display:flex;gap:14px;overflow-x:auto;padding:8px 20px 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.skin-carousel::-webkit-scrollbar{display:none}
.skin-card{flex:none;width:148px;scroll-snap-align:center;background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.24);border-radius:22px;padding:12px;backdrop-filter:blur(8px);cursor:pointer;transition:transform .18s,border-color .2s,box-shadow .2s}
.skin-card.on{border-color:var(--orange);transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.3)}
.skin-card .sc-name{font-size:14px;font-weight:800;color:#fff}
.skin-card .sc-tag{font-size:10.5px;color:rgba(255,255,255,.62);margin-top:2px;display:block}
.sc-door{height:172px;border-radius:14px;margin-top:10px;position:relative;overflow:hidden;border:3px solid rgba(255,255,255,.28)}
.sc-panel{position:absolute;inset:9px;border:2px solid rgba(255,255,255,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px}
.sc-screen{width:36px;height:54px;border-radius:8px;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center}
.sc-screen i{width:9px;height:9px;border-radius:50%;background:var(--orange)}
.sc-handle{width:9px;height:36px;border-radius:5px}
.sc-swatches{display:flex;gap:6px;margin-top:11px;justify-content:center}
.sc-swatches span{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55)}
.sc-used{position:absolute;top:9px;right:9px;font-size:10px;background:var(--orange);color:#fff;border-radius:999px;padding:3px 8px;font-weight:800}
.skins-foot{padding:2px 20px 26px;position:relative;z-index:2}
.sk-ft-nav{display:flex;gap:24px;justify-content:center;color:rgba(255,255,255,.75);font-size:14px;font-weight:700;margin-bottom:16px}
.sk-ft-nav span.on{color:#fff;border-bottom:2.5px solid var(--orange);padding-bottom:3px}
/* discover 小红书素材 */
.post .p-img2{height:auto}
.post .p-img2 img{width:100%;height:300px;object-fit:cover;display:block;background:#F0EFED}
.post .p-img2 .vt{position:absolute;top:12px;left:12px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:4px 10px;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.post .p-img2 .tag-row{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 11px;background:linear-gradient(transparent,rgba(20,20,18,.62));font-size:12px;color:#fff;font-weight:600}
.post .p-img2.art{height:150px}

/* unlock animation */
@keyframes unlockFlash{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 40px rgba(34,197,94,0)}}
.unlocking{animation:unlockFlash 1s 2}
</style>

}

  state[key] = !state[key]; el.classList.toggle('on', state[key]);

  const lists = cats.map((c,i)=>`<div class="msg-list" id="msgl${i}" style="${i===0?'':'display:none'}">${
    state.msgs[c[0]].map(m=>`<div class="row"><span class="r-ic" style="background:${c[0]==='urgent'?'rgba(229,72,77,.1)':'rgba(26,34,70,.07)'}">${c[0]==='urgent'?I.bell:I.msg}</span>
    <span class="r-tx"><span class="r-t" style="font-size:14.5px">${m.t}</span><div class="r-s">${m.s} · ${m.d}</div></span></div>`).join('')
  }</div>`).join('');
  return `<div class="screen no-tab">
    ${head('消息中心')}
    <div style="padding:6px 16px">
      <div class="pills">${tabs}</div>
      <div class="card" style="margin-top:14px">${lists}</div>
    </div></div>`;
}};
function msgTab(i){
  [0,1,2].forEach(k=>{ $('#msgt'+k).classList.toggle('on', k===i); $('#msgl'+k).style.display = k===i?'block':'none'; });
}

let skinIdx = 0;
try{ skinIdx = parseInt(localStorage.getItem('bk_skin')||'0',10)||0; }catch(e){}
skinIdx = Math.min(Math.max(skinIdx,0), SKINS.length-1);
function currentSkin(){ return SKINS[skinIdx] || SKINS[0]; }
function setSkin(id){ const i = SKINS.findIndex(s=>s.id===id); if(i>=0){ skinIdx=i; try{ localStorage.setItem('bk_skin', String(i)); }catch(e){} } }
function pickSkin(el, id){
  document.querySelectorAll('#skinCarousel .skin-card').forEach(c=>{
    c.classList.remove('on');
    const u=c.querySelector('.sc-used'); if(u) u.remove();
  });
  el.classList.add('on');
  setSkin(id);
  const d=document.createElement('div'); d.className='sc-used'; d.textContent='使用中'; el.appendChild(d);
}
function applySkin(){ setSkin(currentSkin().id); toast('已切换背壳 · '+currentSkin().name); go('home'); }
function savePlan(){ toast('已保存至搭配方案'); }
function skinCard(s){
  const on = s.id === currentSkin().id;
  return `<div class="skin-card ${on?'on':''}" data-id="${s.id}" onclick="pickSkin(this,'${s.id}')">
    <div class="sc-name">${s.name}</div>
    <div class="sc-tag">${s.tag}</div>
    <div class="sc-door" style="background:${s.hero}">
      <div class="sc-panel">
        <span class="sc-screen"><i></i></span>
        <span class="sc-handle" style="background:${s.accent}"></span>
      </div>
    </div>
    <div class="sc-swatches">${s.swatches.map(c=>`<span style="background:${c}"></span>`).join('')}</div>
    ${on?'<span class="sc-used">使用中</span>':''}
  </div>`;
}

/* ================= router ================= */
let navStack = ['home'];
function go(id){
  if(!S[id]) return;
  if(S[id].tab){ navStack = [id]; } else { navStack.push(id); }
  if(location.hash !== '#'+id){ location.hash = '#'+id; } else { render(); }
}
function back(){
  if(navStack.length > 1){ navStack.pop(); location.hash = '#'+navStack[navStack.length-1]; }
  else { go('home'); }
}
function render(){
  let id = location.hash.slice(1) || 'home';
  if(!S[id]){ id = 'home'; location.hash = '#'+id; }
  if(navStack[navStack.length-1] !== id){ navStack.push(id); }
  const s = S[id];
  $('#screen').innerHTML = s.render();
  $('#screen').scrollTop = 0;
  showTab(!!s.tab);
  document.querySelectorAll('#tabbar .tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===id));
  const center = document.querySelector('#tabbar .tab-center');
  if(center){ center.style.opacity = id==='bklife' ? 1 : .9; }
}
window.addEventListener('hashchange', render);
$('#modal').addEventListener('click', e=>{ if(e.target === $('#modal')) closeSheet(); });

/* ================= init ================= */
try { go('home'); }
catch(err){
  $('#screen').innerHTML = '<div style="padding:80px 30px;color:#E5484D;font-size:14px;line-height:1.9">页面初始化出错：' + esc(err.message) + '<br><br>请使用最新版 Chrome / Edge 打开。</div>';
  showTab(false);
}
